spring.application.name=rideshare
# Hosts such as Render inject PORT; 8081 locally
server.port=${PORT:8081}
# Behind an HTTPS proxy (Render), use X-Forwarded-* so redirects and the
# Swagger "servers" URL are https, not http
server.forward-headers-strategy=framework

# MongoDB connection (set MONGODB_URI in production, e.g. a MongoDB Atlas URI)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/rideshare}

# JWT: JWT_SECRET is required (at least 32 characters), never committed
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Swagger UI at /swagger-ui.html, OpenAPI JSON at /v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.persist-authorization=true

# Optional logging
logging.level.org.springframework.security=INFO
